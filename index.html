<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' https://world.openfoodfacts.org https://search.openfoodfacts.org https://generativelanguage.googleapis.com https://api.anthropic.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Yummer</title>
<meta name="theme-color" content="#f5f7f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111613" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Yummer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="wrap" id="app">
  <header class="top"><div class="brand">Yummer</div></header>
  <p class="muted">Загружаем дневник…</p>
</div>
<div id="sheetRoot"></div>
<input type="file" id="camInput" accept="image/*" capture="environment" hidden>
<input type="file" id="importInput" accept="application/json,.json" hidden>
<div class="scanner" id="scanner" hidden>
  <video id="scanVideo" playsinline muted autoplay></video>
  <div class="frame"></div>
  <div class="bar">
    <div class="hint" id="scanHint">Наведите камеру на штрихкод</div>
    <button class="btn block" data-act="scanPhoto">Сделать фото вместо этого</button>
    <button class="btn block" data-act="scanClose">Отмена</button>
  </div>
</div>

<script src="vendor/zxing.min.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
