/* Layout: one phone-width column; sticky date bar, summary dial, meal lists, bottom tab bar; sheets slide up for adding food. */
:root {
  --bg: #f5f7f4;

* { box-sizing: border-box; }
:root { padding-top: env(safe-area-inset-top, 0px); }
html, body { margin: 0; }
[hidden] { display: none !important; }
html, body { background: var(--bg); color: var(--fg); }
body { font-family: var(--body); font-size: 15px; line-height: 1.45; -webkit-tap-highlight-color: transparent; }
button, input, select { font: inherit; color: inherit; }
.num { font-variant-numeric: tabular-nums; }
.wrap { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 96px; }

body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 12px 10px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.brand { font-family: var(--display); font-weight: 700; font-size: 22px; letter-spacing: -0.01em; }

.datenav .label { min-width: 104px; text-align: center; font-weight: 600; font-size: 14px; }

.banner { background: var(--accent-soft); border-radius: var(--r); padding: 10px 12px; font-size: 13px; margin-bottom: 12px; }
.banner.warn { background: color-mix(in srgb, var(--warn) 16%, var(--surface)); }

.summary { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 16px; display: grid; grid-template-columns: 132px 1fr; gap: 18px; align-items: center; }
.dial { position: relative; width: 132px; height: 132px; }
.dial svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.dial .center { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.dial .big { font-family: var(--display); font-size: 30px; font-weight: 700; line-height: 1; }
.dial .small { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-top: 4px; }
.macros { display: grid; gap: 10px; min-width: 0; }
.macro .row { display: flex; justify-content: space-between; font-size: 13px; gap: 6px; }
.macro .row b { font-weight: 600; }
.macro .row span { color: var(--muted); }
.bar { height: 7px; background: var(--sunk); border-radius: 99px; overflow: hidden; margin-top: 4px; }
.bar i { display: block; height: 100%; border-radius: 99px; }
.kcalline { grid-column: 1 / -1; display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 10px; }
.kcalline b { color: var(--fg); font-weight: 600; }

.meal { margin-top: 18px; }
.meal h2 { font-family: var(--display); font-size: 18px; font-weight: 700; margin: 0; }
.meal .mhead { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
.meal .mk { color: var(--muted); font-size: 13px; }
.list { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.item { display: flex; align-items: center; gap: 10px; padding: 11px 14px; border: 0; border-bottom: 1px solid var(--line); background: none; width: 100%; text-align: left; cursor: pointer; }
.item:last-child { border-bottom: 0; }
.item .main { flex: 1; min-width: 0; }
.item .name { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .sub { font-size: 12px; color: var(--muted); }
.item .kc { font-weight: 600; font-size: 14px; white-space: nowrap; }
.dots { display: inline-flex; gap: 8px; }
.dots i { font-style: normal; }
.dots i::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 3px; background: currentColor; vertical-align: 1px; }
.dots .p::before { background: var(--protein); } .dots .f::before { background: var(--fat); } .dots .c::before { background: var(--carbs); }
.addrow { display: flex; align-items: center; gap: 8px; width: 100%; padding: 11px 14px; border: 0; background: none; color: var(--accent); font-weight: 600; cursor: pointer; text-align: left; }
.addrow::before { content: "+"; font-size: 20px; line-height: 1; }

nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line); display: flex; justify-content: center; padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
nav.tabs .in { display: flex; width: 100%; max-width: 560px; }
nav.tabs button { flex: 1; border: 0; background: none; padding: 10px 0 12px; font-size: 13px; font-weight: 600; color: var(--muted); cursor: pointer; border-top: 3px solid transparent; }
nav.tabs button[aria-current="page"] { color: var(--accent); border-top-color: var(--accent); }

.section-title { font-family: var(--display); font-size: 20px; font-weight: 700; margin: 6px 0 10px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; }
.field { display: grid; gap: 4px; }
.field label { font-size: 12px; color: var(--muted); font-weight: 500; }
input[type=text], input[type=number], input[type=search], select, textarea {

textarea { font: inherit; font-size: 16px; color: inherit; resize: vertical; min-height: 84px; }
input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.btn { border: 0; border-radius: 12px; padding: 12px 16px; font-weight: 600; cursor: pointer; background: var(--sunk); }

.btn.danger { background: none; color: var(--warn); }
.btn.block { width: 100%; }

.muted { color: var(--muted); }
.small { font-size: 13px; }
.stack { display: grid; gap: 12px; }
.empty { text-align: center; padding: 28px 12px; color: var(--muted); }

/* Sheet */
.scrim { position: fixed; inset: 0; background: rgb(0 0 0 / .38); z-index: 20; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; display: flex; justify-content: center; }

.sheet .grab { width: 40px; height: 4px; border-radius: 4px; background: var(--line); margin: 0 auto 10px; }
.sheet h3 { font-family: var(--display); font-size: 20px; margin: 0 0 12px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }

.tools { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0; }
.tool { border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 10px 6px; display: grid; justify-items: center; gap: 4px; font-size: 12px; font-weight: 600; cursor: pointer; text-align: center; }

.results .item { padding-inline: 4px; }

.preview { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; text-align: center; background: var(--bg); border-radius: 12px; padding: 10px 4px; }
.preview b { display: block; font-size: 17px; font-weight: 600; }
.preview span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.seg { display: flex; background: var(--sunk); border-radius: 10px; padding: 3px; gap: 3px; }
.seg button { flex: 1; border: 0; background: none; padding: 8px 4px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); }
.status { font-size: 13px; color: var(--muted); min-height: 1.2em; }
.status.err { color: var(--warn); }
.aiitems .item { cursor: default; }
@media (max-width: 380px) { .summary { grid-template-columns: 1fr; justify-items: center; } .macros { width: 100%; } }
@media (prefers-reduced-motion: no-preference) { .sheet .panel { animation: up .18s ease-out; } @keyframes up { from { transform: translateY(24px); opacity: .6; } } }
/* Scanner */
.scanner { position: fixed; inset: 0; z-index: 40; background: #000; display: flex; flex-direction: column; }
.scanner video { flex: 1; width: 100%; height: 100%; object-fit: cover; min-height: 0; }
.scanner .frame { position: absolute; left: 10%; right: 10%; top: 38%; height: 22%; border: 3px solid rgb(255 255 255 / .9); border-radius: 16px; box-shadow: 0 0 0 9999px rgb(0 0 0 / .35); pointer-events: none; }
.scanner .bar { position: absolute; left: 0; right: 0; bottom: 0; padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 10px; background: linear-gradient(transparent, rgb(0 0 0 / .7)); }
.scanner .hint { color: #fff; text-align: center; font-size: 14px; }
.scanner .btn { background: rgb(255 255 255 / .92); color: #111; }
.keybox { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 14px; }

/* ---------- Helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const r1 = n => Math.round((+n || 0) * 10) / 10;
const fm = n => { n = +n || 0; return n >= 10 ? String(Math.round(n)) : String(r1(n)); };
const pad = n => String(n).padStart(2, "0");
const dkey = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const fromKey = k => { const [y,m,d] = k.split("-").map(Number); return new Date(y, m - 1, d); };
const shift = (k, n) => { const d = fromKey(k); d.setDate(d.getDate() + n); return dkey(d); };
const today = () => dkey(new Date());
function dateLabel(k) {
  const t = today();
  if (k === t) return "Сегодня"; if (k === shift(t, -1)) return "Вчера"; if (k === shift(t, 1)) return "Завтра";
  return fromKey(k).toLocaleDateString("ru-RU", { weekday: "short", day: "numeric", month: "short" });
}
const scale = (f, g) => ({ kcal: f.kcal * g / 100, protein: f.protein * g / 100, fat: f.fat * g / 100, carbs: f.carbs * g / 100 });
const uidLocal = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
const norm = s => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/ł/g, "l");

/* ---------- AI: Google Gemini (free tier, default) or Claude, with the person's own key stored on this device ---------- */
const CLAUDE_MODEL = "claude-opus-5-5";
const AI = {
  provider: "gemini", keys: { gemini: null, claude: null }, geminiModel: "gemini-3.5-flash-lite",
  get key() { return this.keys[this.provider]; },
  ready() { return !!this.key; },
  label() { return this.provider === "gemini" ? "Gemini" : "Claude"; },
  async call(text, images, wantJSON, schema) {
    if (!this.key) throw Object.assign(new Error("Добавьте ключ " + this.label() + " в «Настройках», чтобы пользоваться ИИ."), { code: "nokey" });
    if (!navigator.onLine) throw Object.assign(new Error("Нет интернета."), { code: "offline" });
    const b64 = []; for (const img of images || []) b64.push(await blobToB64(img));
    return this.provider === "gemini" ? this.gemini(text, b64, wantJSON) : this.claude(text, b64, schema);
  },
  async gemini(text, b64, wantJSON) {
    const parts = b64.map(d => ({ inline_data: { mime_type: "image/jpeg", data: d } })); parts.push({ text });
    let r;
    try {
      r = await fetch("https://generativelanguage.googleapis.com/v1beta/models/" + encodeURIComponent(this.geminiModel) + ":generateContent", {
        method: "POST", headers: { "Content-Type": "application/json", "x-goog-api-key": this.key },
        body: JSON.stringify({ contents: [{ role: "user", parts }], generationConfig: wantJSON ? { responseMimeType: "application/json" } : {} }) });
    } catch { throw Object.assign(new Error("Не удалось связаться с Gemini. Попробуйте ещё раз."), { code: "net" }); }
    const j = await r.json().catch(() => ({}));
    if (!r.ok) {
      const msg = (j.error && j.error.message) || "";
      if (r.status === 429) throw Object.assign(new Error("Бесплатный лимит Gemini на сейчас исчерпан. Подождите минуту (или до завтра, если кончился дневной лимит)."), { code: "rate" });
      if (r.status === 404) throw Object.assign(new Error("Модель «" + this.geminiModel + "» не найдена. Укажите другую модель в «Настройках»."), { code: "model" });
      if (r.status === 400 && /api key/i.test(msg) || r.status === 401 || r.status === 403) throw Object.assign(new Error("Ключ Gemini не подошёл. Проверьте его в «Настройках»."), { code: "auth" });
      throw Object.assign(new Error("Gemini вернул ошибку " + r.status + (msg ? ": " + msg : "")), { code: "bad" });
    }
    const c = j.candidates && j.candidates[0];
    const out = c && c.content && (c.content.parts || []).map(x => x.text || "").join("");
    if (!out) throw Object.assign(new Error("Gemini не дал ответа" + (c && c.finishReason ? " (" + c.finishReason + ")" : "") + ". Попробуйте ещё раз."), { code: "empty" });
    return out;
  },
  async claude(text, b64, schema) {
    if (!window.__Anthropic) await new Promise(r => window.addEventListener("anthropic-ready", r, { once: true }));
    const client = new window.__Anthropic({ apiKey: this.key, dangerouslyAllowBrowser: true, maxRetries: 1 });
    const content = b64.map(d => ({ type: "image", source: { type: "base64", media_type: "image/jpeg", data: d } })); content.push({ type: "text", text });
    let res;
    try {
      res = await client.beta.messages.create({
        model: CLAUDE_MODEL, max_tokens: 4000,
        betas: ["server-side-fallback-2026-07-01"], fallbacks: "default",
        output_config: schema ? { effort: "low", format: { type: "json_schema", schema } } : { effort: "low" },
        messages: [{ role: "user", content }],
      });
    } catch (e) {
      const st = e && e.status;
      if (st === 401) throw Object.assign(new Error("Ключ Claude не подошёл. Проверьте его в «Настройках»."), { code: "auth" });
      if (st === 429) throw Object.assign(new Error("Слишком много запросов. Подождите минуту и попробуйте снова."), { code: "rate" });
      if (st === 400) throw Object.assign(new Error("Запрос не принят: " + (e.message || "")), { code: "bad" });
      throw Object.assign(new Error("Не удалось связаться с Claude. Попробуйте ещё раз."), { code: "net" });
    }
    if (res.stop_reason === "refusal") throw Object.assign(new Error("Claude отказался обработать этот запрос."), { code: "refusal" });
    return res.content.filter(b => b.type === "text").map(b => b.text).join("");
  },
  async text(prompt) { return this.call(prompt, [], false); },
  async json(prompt, schema, images) {
    const t = await this.call(prompt, images, true, schema);
    const x = t.indexOf("{"), y = t.lastIndexOf("}");
    return JSON.parse(x >= 0 ? t.slice(x, y + 1) : t);
  },
};
async function saveAISettings() { await IDB.put("kv", { provider: AI.provider, keys: AI.keys, geminiModel: AI.geminiModel }, "ai"); }
function blobToB64(blob) { return new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(",")[1]); fr.onerror = rej; fr.readAsDataURL(blob); }); }

/* ---------- Data layer: IndexedDB on this device ---------- */
const IDB = {
  db: null,
  open() {
    return new Promise((res, rej) => {
      const rq = indexedDB.open("yummer", 1);
      rq.onupgradeneeded = () => {
        const d = rq.result;
        const en = d.createObjectStore("entries", { keyPath: "id" }); en.createIndex("date", "date"); en.createIndex("createdAt", "createdAt");
        d.createObjectStore("foods", { keyPath: "id" });
        d.createObjectStore("kv");
      };
      rq.onsuccess = () => { this.db = rq.result; res(); };
      rq.onerror = () => rej(rq.error);
    });
  },
  tx(store, mode, fn) {
    return new Promise((res, rej) => {
      const t = this.db.transaction(store, mode); const st = t.objectStore(store); let out;
      const r = fn(st); if (r) r.onsuccess = () => { out = r.result; };
      t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    });
  },
  all(store) { return this.tx(store, "readonly", st => st.getAll()); },
  byDate(date) { return this.tx("entries", "readonly", st => st.index("date").getAll(date)); },
  put(store, v, key) { return this.tx(store, "readwrite", st => key === undefined ? st.put(v) : st.put(v, key)); },
  get(store, key) { return this.tx(store, "readonly", st => st.get(key)); },
  del(store, key) { return this.tx(store, "readwrite", st => st.delete(key)); },
  clear(store) { return this.tx(store, "readwrite", st => st.clear()); },
};
const uid2 = () => (crypto.randomUUID ? crypto.randomUUID() : uidLocal());
function clean(o) { const out = {}; for (const [k, v] of Object.entries(o)) if (v !== undefined) out[k] = v; return out; }
async function reloadFoods() { S.foods = await IDB.all("foods"); render(); }
async function watchDay() { const d = S.date; const list = await IDB.byDate(d); if (S.date === d) { S.entries = list; render(); } }

const Data = {
  async saveGoals(g) { S.goals = g; S.goalsSet = true; await IDB.put("kv", g, "goals"); render(); },
  async addFood(f) { const id = uid2(); await IDB.put("foods", clean({ ...f, id, createdAt: Date.now() })); await reloadFoods(); return id; },
  async updateFood(id, f) { const cur = await IDB.get("foods", id); await IDB.put("foods", clean({ ...cur, ...f, id })); await reloadFoods(); },
  async deleteFood(id) { await IDB.del("foods", id); await reloadFoods(); },
  async addEntry(e) { await IDB.put("entries", clean({ ...e, id: uid2(), createdAt: Date.now() })); await watchDay(); },
  async updateEntry(id, e) { const cur = (await IDB.get("entries", id)) || {}; await IDB.put("entries", clean({ ...cur, ...e, id })); await watchDay(); },
  async deleteEntry(id) { await IDB.del("entries", id); await watchDay(); },
  async recent() {
    const list = (await IDB.all("entries")).sort((a, b) => b.createdAt - a.createdAt);
    const seen = new Set(), out = [];
    for (const e of list) { const k = norm(e.name); if (seen.has(k) || !e.per100) continue; seen.add(k); out.push(e); if (out.length >= 12) break; }
    return out;
  },
  async exportAll() {
    return { app: "yummer", version: 1, exportedAt: new Date().toISOString(), goals: await IDB.get("kv", "goals") || null, foods: await IDB.all("foods"), entries: await IDB.all("entries") };
  },
  async importAll(d) {
    if (!d || d.app !== "yummer" || !Array.isArray(d.entries) || !Array.isArray(d.foods)) throw new Error("Это не файл резервной копии Yummer.");
    for (const f of d.foods) if (f && f.id) await IDB.put("foods", f);
    for (const e of d.entries) if (e && e.id && e.date) await IDB.put("entries", e);
    if (d.goals) await this.saveGoals(d.goals);
    await reloadFoods(); await watchDay();
    return { foods: d.foods.length, entries: d.entries.length };
  },
};

function totals(list) { return list.reduce((t, e) => ({ kcal: t.kcal + (+e.kcal || 0), protein: t.protein + (+e.protein || 0), fat: t.fat + (+e.fat || 0), carbs: t.carbs + (+e.carbs || 0) }), { kcal: 0, protein: 0, fat: 0, carbs: 0 }); }

function dial(t, g) {
  const R = 56, C = 2 * Math.PI * R, pct = Math.min(1, g.kcal ? t.kcal / g.kcal : 0), over = t.kcal > g.kcal;
  const left = Math.round(g.kcal - t.kcal);
  return `<div class="dial" role="img" aria-label="Съедено ${Math.round(t.kcal)} из ${g.kcal} ккал">
    <svg viewBox="0 0 132 132"><circle cx="66" cy="66" r="${R}" fill="none" stroke="var(--sunk)" stroke-width="12"/>
    ${pct > 0 ? `<circle cx="66" cy="66" r="${R}" fill="none" stroke="${over ? "var(--warn)" : "var(--accent)"}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C * pct} ${C}"/>` : ""}</svg>
    <div class="center"><div class="big num">${Math.abs(left)}</div><div class="small">${left >= 0 ? "ккал осталось" : "ккал сверх нормы"}</div></div></div>`;
}
function macroBar(label, key, t, g, color) {
  const pct = g[key] ? Math.min(100, t[key] / g[key] * 100) : 0;
  return `<div class="macro"><div class="row"><b>${label}</b><span class="num">${fm(t[key])} / ${g[key]} г</span></div>
    <div class="bar"><i style="width:${pct}%;background:var(${color})"></i></div></div>`;
}
const dots = e => `<span class="dots num"><i class="p">${fm(e.protein)}</i><i class="f">${fm(e.fat)}</i><i class="c">${fm(e.carbs)}</i></span>`;

function sheetSearch(s) {

    const words = q.split(/\s+/).filter(Boolean);
    const hit = f => { const n = norm(f.name + " " + (f.brand || "")); return words.every(w => n.includes(w)); };
    const code = s.q.trim();
    results = [...mine.filter(f => hit(f) || (f.barcode && f.barcode === code)), ...GENERIC.filter(hit)].slice(0, 30);
  } else results = null;
  const tools = `<div class="tools">
    <button class="tool" data-act="scan">${ICON.scan}Штрихкод</button>
    <button class="tool" data-act="labelPhoto">${ICON.label}Фото этикетки</button>
    <button class="tool" data-act="toAI">${ICON.ai}Описать словами</button></div>`;
  let list = "";
  const row = f => `<button class="item" data-act="pick" data-src="${f.source}" data-id="${esc(f.id)}"><div class="main"><div class="name">${esc(f.name)}${f.source === "generic" ? '<span class="tag">базовый</span>' : f.source === "recent" ? '<span class="tag">недавнее</span>' : f.source === "off" ? '<span class="tag">OFF</span>' : ""}</div>

    `<div class="empty">По запросу «${esc(s.q)}» ничего не найдено. Попробуйте «Описать словами» или <button class="btn" data-act="newFood" style="padding:4px 10px">создайте продукт</button></div>`;
  else if (s.recent?.length) list = `<p class="small muted" style="margin:4px 0">Недавно ели</p><div class="results">${s.recent.map(e => row({ id: "r:" + e.name, name: e.name, ...e.per100, source: "recent" })).join("")}</div>`;
  else list = `<p class="small muted">Ищите среди своих продуктов и ${GENERIC.length} базовых продуктов, ищите товары польских магазинов в Open Food Facts, сканируйте штрихкод или опишите еду своими словами.</p>`;
  return `<h3>${esc(mealLabel(s.meal))}: добавить<button data-act="close" aria-label="Закрыть">✕</button></h3>

}

function readFoodForm() {
  const g = id => $("#" + id)?.value.trim();
  const n = id => { const x = parseFloat(String(g(id) || "").replace(",", ".")); return isFinite(x) ? x : null; };
  return { name: g("f-name"), brand: g("f-brand") || null, barcode: (g("f-barcode") || "").replace(/\D/g, "") || null,
    kcal: n("f-kcal"), protein: n("f-protein"), fat: n("f-fat"), carbs: n("f-carbs"), serving: n("f-serving") };
}

/* ---------- Images: barcode decode + label reading ---------- */
let camPurpose = null;
function pickPhoto(purpose) { camPurpose = purpose; const inp = $("#camInput"); inp.value = ""; inp.click(); }

async function decodeBarcode(file) {
  if ("BarcodeDetector" in window) {
    try {
      const det = new window.BarcodeDetector({ formats: ["ean_13", "ean_8", "upc_a", "upc_e", "code_128", "qr_code"] });
      const bmp = await createImageBitmap(file);
      const codes = await det.detect(bmp);
      if (codes.length) return codes[0].rawValue;
    } catch {}
  }
  if (window.ZXing) {
    const url = URL.createObjectURL(file);
    try {
      const hints = new Map(); hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
      const reader = new ZXing.BrowserMultiFormatReader(hints);
      const res = await reader.decodeFromImageUrl(url);
      return res.getText();
    } catch {} finally { URL.revokeObjectURL(url); }
  }
  return null;
}

async function shrink(file, max = 1600) {
  try {
    const bmp = await createImageBitmap(file);
    const k = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas"); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    return await new Promise(res => c.toBlob(b => res(b || file), "image/jpeg", 0.85));
  } catch { return file; }
}

const LABEL_PROMPT = `Read this photo of a food product (nutrition table and/or front of the pack, possibly in Polish).
Return JSON only, no prose, in exactly this shape:
{"name": string|null, "brand": string|null, "barcode": string|null, "kcal": number|null, "protein": number|null, "fat": number|null, "carbs": number|null, "serving": number|null}
Rules: nutrition values are per 100 g or 100 ml (in Polish "w 100 g"). If only kJ is shown, divide by 4.184. "carbs" is total carbohydrates (węglowodany), not sugars.
"serving" is the portion or pack size in grams if printed, else null. "barcode" is the digits under a barcode if visible, else null. Give the product name in its original language as printed on the pack. Use null for anything unreadable.`;

const NUM = { type: ["number", "null"] }, STR = { type: ["string", "null"] };
const LABEL_SCHEMA = { type: "object", additionalProperties: false, required: ["name", "brand", "barcode", "kcal", "protein", "fat", "carbs", "serving"],
  properties: { name: STR, brand: STR, barcode: STR, kcal: NUM, protein: NUM, fat: NUM, carbs: NUM, serving: NUM } };
const ITEMS_SCHEMA = { type: "object", additionalProperties: false, required: ["items"], properties: { items: { type: "array", items: { type: "object", additionalProperties: false,
  required: ["name", "grams", "kcal", "protein", "fat", "carbs"], properties: { name: { type: "string" }, grams: { type: "number" }, kcal: { type: "number" }, protein: { type: "number" }, fat: { type: "number" }, carbs: { type: "number" } } } } } };
async function readLabel(file) {
  const img = await shrink(file);
  const out = await AI.json(LABEL_PROMPT, LABEL_SCHEMA, [img]);
  if (!out || typeof out !== "object") throw new Error("Не удалось прочитать этикетку. Сделайте более чёткое фото поближе.");
  return out;
}

$("#camInput").addEventListener("change", async ev => {
  const file = ev.target.files && ev.target.files[0];
  if (!file || !sheet) return;
  const purpose = camPurpose;
  if (purpose === "scan") {
    setStatus("Распознаём штрихкод…");
    let code = await decodeBarcode(file);
    if (!code && AI.ready()) {
      setStatus("Полоски не распознались, просим Claude прочитать цифры…");
      try { const r = await readLabel(file); code = r.barcode ? String(r.barcode).replace(/\D/g, "") : null; } catch {}
    }
    if (!code) return setStatus("Штрихкод не найден. Снимите ближе, чтобы штрихкод занимал большую часть фото, или введите цифры в поиск.", true);
    handleCode(code.trim());
  } else if (purpose === "label" || purpose === "labelForm") {
    if (sheet.step !== "food") openSheet({ step: "food", meal: sheet.meal, food: { barcode: sheet.pendingCode || null }, busy: true, status: "Читаем этикетку…" });
    else { sheet.busy = true; sheet.status = "Читаем этикетку…"; sheet.err = false; renderSheet(); }
    try {
      const cur = readFoodForm();
      const r = await readLabel(file);
      const merged = { ...cur };
      for (const k of ["name", "brand", "kcal", "protein", "fat", "carbs", "serving"]) if (r[k] != null && r[k] !== "") merged[k] = r[k];
      if (!merged.barcode && r.barcode) merged.barcode = String(r.barcode).replace(/\D/g, "");
      sheet.food = merged; sheet.busy = false;
      const missing = ["kcal", "protein", "fat", "carbs"].filter(k => merged[k] == null);
      sheet.status = missing.length ? "Заполнено то, что удалось прочитать. Добавьте: " + missing.map(k => ({kcal:"ккал",protein:"белки",fat:"жиры",carbs:"углеводы"})[k]).join(", ") + "." : "Заполнено по этикетке. Проверьте цифры и сохраните.";
      sheet.err = !!missing.length; renderSheet();
    } catch (e) { sheet.busy = false; sheet.status = (e?.message || "Не удалось прочитать этикетку."); sheet.err = true; renderSheet(); }
  }
});

function setStatus(msg, err) { if (!sheet) return; sheet.status = msg; sheet.err = !!err; renderSheet(); }

function handleCode(code) {
  const digits = code.replace(/\s/g, "");
  const found = S.foods.find(f => f.barcode && f.barcode === digits);
  if (found) { openSheet({ step: "amount", meal: sheet.meal, food: { ...found, source: "mine" }, grams: found.serving || 100, unit: found.serving ? "srv" : "g" }); return; }
  if (/^https?:\/\//i.test(digits)) { setStatus("В этом QR-коде ссылка (" + digits.slice(0, 60) + "), а не данные о продукте. Сканируйте штрихкод.", true); return; }
  if (navigator.onLine) { lookupBarcode(digits); return; }
  newProductForm(digits, "Товара " + digits + " нет среди ваших продуктов.");
}
async function lookupBarcode(digits) {
  setStatus("Ищем " + digits + " в Open Food Facts…");
  try {
    const f = await offByBarcode(digits);
    if (!sheet) return;
    if (offComplete(f)) { openSheet({ step: "amount", meal: sheet.meal, food: f, grams: f.serving || 100, unit: f.serving ? "srv" : "g" }); return; }
    newProductForm(digits, f ? "Товар найден в Open Food Facts, но без полной пищевой ценности." : "Товара " + digits + " нет в Open Food Facts.", f);
  } catch (e) { if (sheet) newProductForm(digits, offErrorText(e)); }
}
function newProductForm(digits, why, partial) {
  openSheet({ step: "food", meal: sheet.meal, food: { ...(partial || {}), barcode: digits, source: undefined }, pendingCode: digits,
    status: why + " Сфотографируйте таблицу пищевой ценности, и поля заполнятся сами, или введите значения вручную. Продукт сохранится, и в следующий раз штрихкод найдётся сразу." });
}

/* ---------- Live search UI ---------- */
function offBlock(s, row) {
  if (!navigator.onLine) return `<p class="small muted" style="margin-top:14px">Нет интернета: поиск в Open Food Facts недоступен.</p>`;
  const q = (s.q || "").trim();
  let h = `<div style="margin-top:14px" class="stack">`;
  if (q && !/^\d{8,14}$/.test(q)) h += `<button class="btn block" data-act="offSearch" ${s.offBusy ? "disabled" : ""}>${s.offBusy ? "Ищем в Open Food Facts…" : "Искать «" + esc(q) + "» в Open Food Facts" + (/[а-яё]/i.test(q) && AI.ready() ? " (по-польски)" : "")}</button>`;
  if (s.offErr) h += `<div class="status err">${esc(s.offErr)}</div>`;
  if (s.offResults && s.offFor === q) h += s.offResults.length ? `<p class="small muted" style="margin:0">Open Food Facts${s.offQuery && s.offQuery !== q ? " (по-польски: «" + esc(s.offQuery) + "»)" : ""}</p><div class="results">${s.offResults.map(row).join("")}</div>` : `<p class="small muted" style="margin:0">В Open Food Facts ничего не нашлось.</p>`;
  h += `<p class="small muted" style="margin:0">Данные о товарах: <a href="https://world.openfoodfacts.org" target="_blank" rel="noopener" style="color:inherit">Open Food Facts</a>, лицензия ODbL.</p></div>`;
  return h;
}
async function runOffSearch() {
  if (!sheet || sheet.step !== "search") return;
  const q = (sheet.q || "").trim(); if (!q) return;
  sheet.offBusy = true; sheet.offErr = ""; renderSheet();
  try { const r = await offSearchLive(q); if (!sheet || sheet.step !== "search") return; sheet.offResults = r.items; sheet.offQuery = r.query; sheet.offFor = q; }
  catch (e) { if (!sheet) return; sheet.offErr = offErrorText(e); }
  sheet.offBusy = false; renderSheet();
}

/* ---------- AI describe ---------- */
async function runAI() {
  const text = ($("#aitext")?.value || "").trim();
  sheet.text = text;
  if (!text) { sheet.status = "Сначала напишите, что вы съели."; sheet.err = true; return renderSheet(); }
  sheet.busy = true; sheet.status = "Спрашиваем Claude…"; sheet.err = false; renderSheet();
  const prompt = `You estimate nutrition for a food diary. The person wrote what they ate:
"""${text}"""
Split it into separate foods. For each, estimate the eaten amount in grams (use typical Polish/European portions and products when not specified) and the TOTAL kcal, protein, fat and carbs for that amount.
Return JSON only, no prose, exactly: {"items":[{"name":string,"grams":number,"kcal":number,"protein":number,"fat":number,"carbs":number}]}
Write food names in Russian.`;
  try {
    const out = await AI.json(prompt, ITEMS_SCHEMA);
    const items = (out?.items || []).filter(i => i && i.name && +i.grams > 0).map(i => ({ name: String(i.name), grams: +i.grams, kcal: +i.kcal || 0, protein: +i.protein || 0, fat: +i.fat || 0, carbs: +i.carbs || 0 }));
    sheet.items = items; sheet.busy = false;
    sheet.status = items.length ? "" : "Не получилось разобрать продукты. Назовите каждый продукт и примерное количество."; sheet.err = !items.length;
  } catch (e) {
    sheet.busy = false; sheet.err = true;
    sheet.status = e?.message || "Не удалось получить оценку. Попробуйте ещё раз.";
  }
  renderSheet();
}

/* ---------- Events ---------- */
function entryFromFood(f, grams, meal) {
  const m = scale(f, grams);
  return { date: S.date, meal, name: f.name + (f.brand ? " (" + f.brand + ")" : ""), grams: r1(grams),
    kcal: r1(m.kcal), protein: r1(m.protein), fat: r1(m.fat), carbs: r1(m.carbs),
    per100: { kcal: +f.kcal, protein: +f.protein, fat: +f.fat, carbs: +f.carbs, serving: f.serving || null },
    foodId: f.source === "mine" ? f.id : null };
}
async function safe(p, ok) { try { await p; if (ok) toast(ok); } catch (e) { toast("Не удалось сохранить: " + (e?.message || "попробуйте ещё раз"), true); } }

document.addEventListener("click", async ev => {
  const b = ev.target.closest("[data-act]");
  if (!b) return;
  const act = b.dataset.act;
  switch (act) {
    case "tab": S.tab = b.dataset.tab; render(); window.scrollTo(0, 0); break;
    case "day": S.date = shift(S.date, +b.dataset.d); render(); watchDay(); break;
    case "close": closeSheet(); break;
    case "add": openSheet({ step: "search", meal: b.dataset.meal, q: "", recent: [] }); Data.recent().then(r => { if (sheet && sheet.step === "search") { sheet.recent = r; renderSheet(); } }); break;
    case "back": openSheet({ step: "search", meal: ($("#mealSel")?.value) || sheet.meal, q: sheet.q0 || "", recent: sheet.recent0 || [] }); Data.recent().then(r => { if (sheet && sheet.step === "search") { sheet.recent = r; renderSheet(); } }); break;
    case "pick": {
      const src = b.dataset.src, id = b.dataset.id;
      let f = src === "mine" ? S.foods.find(x => x.id === id) : src === "generic" ? GENERIC.find(x => x.id === id) : src === "off" ? (sheet.offResults || []).find(x => x.id === id) : null;
      if (src === "recent") { const e = sheet.recent.find(x => "r:" + x.name === id); if (e) f = { name: e.name, ...e.per100, source: "recent", lastGrams: e.grams }; }
      if (!f) return;
      f = { ...f, source: src };
      const grams = f.lastGrams || f.serving || 100;
      openSheet({ step: "amount", meal: sheet.meal, food: f, grams, unit: f.serving && !f.lastGrams ? "srv" : "g", q0: sheet.q, recent0: sheet.recent });
      break;
    }
    case "unit": sheet.unit = b.dataset.u; renderSheet(); break;
    case "addEntry": {
      const grams = +sheet.grams; if (!(grams > 0)) return setStatus("Укажите количество.", true);
      const meal = $("#mealSel").value; const e = entryFromFood(sheet.food, grams, meal);
      const fd = sheet.food; closeSheet();
      if (fd.source === "off" && !S.foods.some(x => x.barcode === fd.barcode)) { const { id, source, ...keep } = fd; try { const nid = await Data.addFood({ ...keep, source: "off" }); e.foodId = nid; } catch {} }
      await safe(Data.addEntry(e), `«${e.name}» добавлено: ${mealLabel(meal)}.`); break;
    }
    case "editEntry": {
      const e = S.entries.find(x => x.id === b.dataset.id); if (!e) return;
      const per = e.per100 || { kcal: e.kcal / e.grams * 100, protein: e.protein / e.grams * 100, fat: e.fat / e.grams * 100, carbs: e.carbs / e.grams * 100 };
      openSheet({ step: "editEntry", id: e.id, meal: e.meal, food: { name: e.name, ...per }, grams: e.grams, unit: "g" }); break;
    }
    case "saveEntry": {
      const grams = +sheet.grams; if (!(grams > 0)) return;
      const m = scale(sheet.food, grams), meal = $("#mealSel").value, id = sheet.id;
      closeSheet(); await safe(Data.updateEntry(id, { grams: r1(grams), meal, kcal: r1(m.kcal), protein: r1(m.protein), fat: r1(m.fat), carbs: r1(m.carbs) }), "Сохранено."); break;
    }
    case "askDel": sheet.confirmDel = true; renderSheet(); break;
    case "delEntry": { const id = sheet.id; closeSheet(); await safe(Data.deleteEntry(id), "Удалено."); break; }
    case "toAI": if (!AI.ready()) return setStatus("Чтобы описывать еду словами, добавьте ключ ИИ в «Настройках».", true); openSheet({ step: "ai", meal: sheet.meal, text: sheet.q || "", q0: sheet.q, recent0: sheet.recent }); break;
    case "runAI": runAI(); break;
    case "aiDrop": sheet.text = $("#aitext").value; sheet.items.splice(+b.dataset.i, 1); renderSheet(); break;
    case "aiAdd": {
      const meal = sheet.meal, items = sheet.items; closeSheet();
      for (const i of items) {
        const per100 = { kcal: r1(i.kcal / i.grams * 100), protein: r1(i.protein / i.grams * 100), fat: r1(i.fat / i.grams * 100), carbs: r1(i.carbs / i.grams * 100), serving: null };
        await safe(Data.addEntry({ date: S.date, meal, name: i.name, grams: r1(i.grams), kcal: r1(i.kcal), protein: r1(i.protein), fat: r1(i.fat), carbs: r1(i.carbs), per100, foodId: null, estimated: true }));
      }
      toast(`Добавлено в «${mealLabel(meal)}»: ${items.length} шт.`); break;
    }
    case "scan": sheet.status = ""; startScanner(); break;
    case "scanClose": stopScanner(); break;
    case "scanPhoto": stopScanner(); pickPhoto("scan"); break;
    case "export": doExport(); break;
    case "import": $("#importInput").value = ""; $("#importInput").click(); break;
    case "testKey": testKey(); break;
    case "askDelKey": S.confirmKeyDel = true; render(); break;
    case "delKey": AI.keys[AI.provider] = null; S.confirmKeyDel = false; await saveAISettings(); render(); toast("Ключ удалён."); break;
    case "provider": AI.provider = b.dataset.p; S.confirmKeyDel = false; await saveAISettings(); render(); break;
    case "offSearch": runOffSearch(); break;
    case "labelPhoto": if (!AI.ready()) return setStatus("Чтобы читать этикетки, добавьте ключ ИИ в «Настройках».", true); pickPhoto("label"); break;
    case "labelIntoForm": sheet.food = readFoodForm(); if (!AI.ready()) return setStatus("Чтобы читать этикетки, добавьте ключ ИИ в «Настройках».", true); pickPhoto("labelForm"); break;
    case "newFood": openSheet({ step: "food", meal: sheet?.meal || null, food: { name: sheet?.q || "" }, q0: sheet?.q, recent0: sheet?.recent }); break;
    case "editFood": { const f = S.foods.find(x => x.id === b.dataset.id); if (f) openSheet({ step: "food", id: f.id, food: { ...f } }); break; }
    case "askDelFood": sheet.food = readFoodForm(); sheet.confirmDel = true; renderSheet(); break;
    case "delFood": { const id = sheet.id; closeSheet(); await safe(Data.deleteFood(id), "Продукт удалён."); break; }
  }
});

document.addEventListener("input", ev => {
  const t = ev.target;
  if (!sheet) {
    if (t.id && t.id.startsWith("g-")) {
      const n = id => +($("#" + id)?.value || 0);
      const el = $("#g-calc"); if (el) el.textContent = Math.round(n("g-protein") * 4 + n("g-fat") * 9 + n("g-carbs") * 4) + " kcal";
    }
    return;
  }
  if (t.id === "q") { sheet.q = t.value; sheet.status = ""; renderSheet(); }
  else if (t.id === "amt") {
    const v = parseFloat(String(t.value).replace(",", ".")) || 0;
    sheet.grams = sheet.unit === "srv" ? v * sheet.food.serving : v;
    const pv = $("#pv"); if (pv) pv.innerHTML = previewHTML(scale(sheet.food, sheet.grams));
  }
  else if (t.id === "aitext") sheet.text = t.value;
});
document.addEventListener("change", ev => { if (sheet && ev.target.id === "mealSel") sheet.meal = ev.target.value; });
document.addEventListener("keydown", ev => {
  if (ev.key === "Escape" && sheet) closeSheet();
  if (ev.key === "Enter" && sheet?.step === "search" && ev.target.id === "q") {
    const v = ev.target.value.trim(); ev.preventDefault(); ev.target.blur(); if (/^\d{8,14}$/.test(v)) handleCode(v); else if (v && navigator.onLine) runOffSearch();
  }
});

document.addEventListener("submit", async ev => {
  ev.preventDefault();
  if (ev.target.id === "goalsForm") {
    const n = id => Math.max(0, Math.round(+$("#" + id).value || 0));
    await safe(Data.saveGoals({ kcal: n("g-kcal") || DEFAULT_GOALS.kcal, protein: n("g-protein"), fat: n("g-fat"), carbs: n("g-carbs") }), "Цели сохранены.");
    S.goalsSet = true; render();
  }
  if (ev.target.id === "keyForm") {
    const k = ($("#k-key").value || "").trim(), m = ($("#k-model")?.value || "").trim();
    if (m) AI.geminiModel = m;
    if (k) {
      const bad = AI.provider === "claude" ? !/^sk-ant-/.test(k) : k.length < 20;
      if (bad) { const st = $("#keyStatus"); st.textContent = AI.provider === "claude" ? "Ключ Claude начинается с «sk-ant-»." : "Это не похоже на ключ Gemini."; st.className = "status err"; return; }
      AI.keys[AI.provider] = k;
    }
    await saveAISettings(); S.confirmKeyDel = false; render(); if (AI.key) testKey();
    return;
  }
  if (ev.target.id === "foodForm") {
    const f = readFoodForm();
    if (!f.name || [f.kcal, f.protein, f.fat, f.carbs].some(x => x == null)) { sheet.food = f; return setStatus("Заполните название и все четыре значения пищевой ценности.", true); }
    if (f.barcode && !sheet.id && S.foods.some(x => x.barcode === f.barcode)) { sheet.food = f; return setStatus("Продукт с таким штрихкодом уже есть в «Моих продуктах».", true); }
    const meal = sheet.meal, id = sheet.id;
    try {
      if (id) { await Data.updateFood(id, f); closeSheet(); toast("Продукт сохранён."); return; }
      const newId = await Data.addFood({ ...f, source: "custom" });
      if (meal) openSheet({ step: "amount", meal, food: { ...f, id: newId, source: "mine" }, grams: f.serving || 100, unit: f.serving ? "srv" : "g" });
      else { closeSheet(); toast("Продукт сохранён."); }
    } catch (e) { setStatus("Не удалось сохранить: " + (e?.message || "попробуйте ещё раз"), true); }
  }
});

/* ---------- Live camera scanner ---------- */
let scanReader = null;
async function startScanner() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.ZXing) { pickPhoto("scan"); return; }
  const box = $("#scanner"), video = $("#scanVideo"); box.hidden = false; $("#scanHint").textContent = "Наведите камеру на штрихкод";
  try {
    const hints = new Map();
    hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [ZXing.BarcodeFormat.EAN_13, ZXing.BarcodeFormat.EAN_8, ZXing.BarcodeFormat.UPC_A, ZXing.BarcodeFormat.UPC_E, ZXing.BarcodeFormat.CODE_128, ZXing.BarcodeFormat.QR_CODE]);
    scanReader = new ZXing.BrowserMultiFormatReader(hints, 250);
    let done = false;
    await scanReader.decodeFromConstraints({ audio: false, video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } } }, video, (result) => {
      if (!result || done) return; done = true;
      try { navigator.vibrate && navigator.vibrate(60); } catch {}
      stopScanner(); if (sheet) handleCode(result.getText().trim());
    });
  } catch (e) {
    stopScanner();
    setStatus(e && e.name === "NotAllowedError" ? "Нет доступа к камере. Разрешите камеру для Yummer в настройках Safari, или сделайте фото штрихкода." : "Камера недоступна, откроем фото.", true);
    if (!(e && e.name === "NotAllowedError")) pickPhoto("scan");
  }
}
function stopScanner() { try { scanReader && scanReader.reset(); } catch {} scanReader = null; $("#scanner").hidden = true; }

/* ---------- Settings actions ---------- */
async function testKey() {
  const st = $("#keyStatus"); if (!st) return; st.className = "status"; st.textContent = "Проверяем ключ…";
  try { await AI.text("Reply with the single word: ok"); const s2 = $("#keyStatus"); if (s2) { s2.textContent = "Ключ работает."; } }
  catch (e) { const s2 = $("#keyStatus"); if (s2) { s2.textContent = e.message; s2.className = "status err"; } }
}
async function doExport() {
  const st = $("#bkStatus");
  try {
    const data = await Data.exportAll();
    const name = "yummer-" + today() + ".json";
    const file = new File([JSON.stringify(data)], name, { type: "application/json" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); }
    else { const a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); }
    if (st) { st.className = "status"; st.textContent = "Копия готова: " + data.entries.length + " записей, " + data.foods.length + " продуктов."; }
  } catch (e) { if (st && e.name !== "AbortError") { st.className = "status err"; st.textContent = "Не удалось сохранить копию: " + e.message; } }
}
$("#importInput").addEventListener("change", async ev => {
  const f = ev.target.files && ev.target.files[0]; if (!f) return;
  const st = $("#bkStatus");
  try { const r = await Data.importAll(JSON.parse(await f.text())); if (st) { st.className = "status"; st.textContent = "Восстановлено: " + r.entries + " записей, " + r.foods + " продуктов."; } }
  catch (e) { if (st) { st.className = "status err"; st.textContent = e.message || "Не удалось прочитать файл."; } }
});
window.addEventListener("online", () => { if (sheet && sheet.step === "search") renderSheet(); });
window.addEventListener("offline", () => { if (sheet && sheet.step === "search") renderSheet(); });

render();
init();
})();
</script>
